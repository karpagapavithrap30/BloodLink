# ─── DataSource (MySQL) ─────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/bloodlink_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Pavi@2007
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── Business Rules ─────────────────────────────────────────────────────────
bloodlink.cooldown-days=90

# ─── Server ─────────────────────────────────────────────────────────────────
server.port=8080

# ─── Springdoc / Swagger ────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ─── Scheduling ─────────────────────────────────────────────────────────────
spring.task.scheduling.pool.size=2

# ─── Logging ────────────────────────────────────────────────────────────────
logging.level.com.bloodlink=DEBUG
